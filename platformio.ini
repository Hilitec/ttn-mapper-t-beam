[env:ttgo-t-beam]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    jgromes/RadioLib @ ^6.6.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    lewisxhe/XPowersLib @ ^0.2.4
    tzapu/WiFiManager @ ^2.0.17
    olikraus/U8g2 @ ^2.35.19
